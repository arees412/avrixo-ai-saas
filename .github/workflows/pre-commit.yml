name: Static validation
on:
  push:
    branches: [main, feat/avrixo-ai-saas]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "latest-known"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: python scripts/setup_env.py
      - run: uv sync --frozen --all-packages
      - run: bun ci
      - run: uv run --package app ruff check backend/app backend/tests
      - run: uv run --package app ruff format --check backend/app backend/tests
      - run: uv run --package app mypy backend/app --config-file backend/pyproject.toml
      - run: uv run --package app ty check backend/app
      - name: Regenerate typed client
        run: |
          cd backend
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > ../frontend/openapi.json
          cd ../frontend
          bunx biome format --write openapi.json
          bun run generate-client
          git diff --exit-code -- src/client
      - run: bun run --filter frontend lint:check
      - run: bun run --filter frontend build
      - run: python scripts/check_secrets.py
      - run: docker compose config --quiet
      - run: docker compose -f compose.yml -f compose.deploy.yml config --quiet
        env:
          DOMAIN: example.com
          EMAIL: ops@example.com
