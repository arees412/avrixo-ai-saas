# Explicit test overlay. Production compose never enables the fake provider.
services:
  fake-provider:
    image: python:3.14-slim
    command: ["python", "/fixture/fake_provider_server.py"]
    volumes:
      - ./backend/tests/fake_provider_server.py:/fixture/fake_provider_server.py:ro
  backend:
    depends_on:
      fake-provider:
        condition: service_started
    environment:
      AI_BASE_URL: http://fake-provider:9001/v1
      AI_API_KEY: test-only-placeholder
      AI_DEFAULT_MODEL: test-model
